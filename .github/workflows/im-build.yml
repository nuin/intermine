---
# yamllint disable rule:line-length
name: InterMine CI
# yamllint disable-line rule:truthy
on:
    workflow_dispatch:
    pull_request:
    push:
        paths:
            - .github/workflows/im-build.yml
            - 'bio/**'
            - 'config/**'
            - 'docs/**'
            - 'intermine/**'
            - 'plugin/**'
            - 'testmine/**'
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        package-manager-cache: false
    - run: node --test bio/webapp/src/test/js/*.test.cjs

  unit-tests:
    runs-on: ubuntu-latest

    services:
      # Label used to access the service container
      postgres:
        image: postgres:14
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTMODEL_PATH: intermine-demo
    strategy:
      fail-fast: true
      matrix:
        testSuite: [intermine, bio]
        java: ['21', '8']
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - name: Set up python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Test build bootstrap
      run: python3 -m unittest discover -s config/lib -p 'test_*.py'
    - name: Install PostgreSQL client
      run: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y libpq-dev postgresql-client
    - name: Run unit tests
      run: |
        set -euo pipefail
        ./config/ci/init.sh ${GITHUB_WORKSPACE} $(which python3) ${{ matrix.testSuite }} none none
        ./config/ci/run.sh ${GITHUB_WORKSPACE} $(which python3) ${{ matrix.testSuite }} none none

  ws-tests:
    runs-on: ubuntu-latest

    services:
      # Label used to access the service container
      postgres:
        image: postgres:14
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTMODEL_PATH: intermine-demo
    strategy:
      fail-fast: true
      matrix:
        client: [JS, PY]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Java 11 for Solr
      id: solr-java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '11'
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install Ubuntu packages
      run: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y libpq-dev postgresql-client wait-for-it
    - name: Run webservices tests
      run: |
        set -euo pipefail
        JAVA_HOME="${{ steps.solr-java.outputs.path }}" ./config/ci/init-solr.sh ${GITHUB_WORKSPACE}
        ./config/ci/init.sh ${GITHUB_WORKSPACE} $(which python3) ws ${{ matrix.client }} http://localhost:8080/intermine-demo
        ./config/ci/run.sh ${GITHUB_WORKSPACE} $(which python3) ws ${{ matrix.client }} http://localhost:8080/intermine-demo
