apply plugin: "war"

buildscript {
    repositories {
        maven {
            url project.getProperty("intermine.maven.central")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
        }
        maven {
            url project.getProperty("intermine.maven.plugins")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.plugins.allowInsecureProtocol") == "true"
        }
    }

    dependencies {
        classpath 'com.bmuschko:gradle-cargo-plugin:2.9.0'
    }
}
apply plugin: "com.bmuschko.cargo"

def explodedWebAppDir = "$buildDir/explodedWebApp"
def mergePropsDir = "$buildDir/props"

ext {
    minePropertyFileName = "testmodel.properties"
    minePropertyFile = "${System.env.HOME}/.intermine/$minePropertyFileName"
    println "Using properties file: '$minePropertyFile' "
}


configurations {
    imWebApp
    tomcat
}

dependencies {
    api(project(":dbmodel")) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                    objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
    api group: "org.intermine", name: "intermine-webapp", version: imVersion, classifier: "classes"
    api group: "org.intermine", name: "intermine-api", version: imVersion
    api group: "org.intermine", name: "intermine-webtasks", version: imVersion
    api group: "javax.servlet", name: "jstl", version: "1.2"
    api group: "org.apache.struts", name: "struts-core", version: "1.3.10"
    api group: 'org.apache.struts', name: 'struts-taglib', version: '1.3.10'
    api group: 'org.apache.struts', name: 'struts-extras', version: '1.3.10'
    api group: 'org.apache.struts', name: 'struts-tiles', version: '1.3.10'
    api group: 'javax.mail', name: 'mail', version: '1.4'
    api group: 'org.directwebremoting', name: 'dwr', version: '2.0.1'
    runtimeOnly group: 'commons-codec', name: 'commons-codec', version: '1.9'
    providedCompile group: 'javax.servlet.jsp', name: 'javax.servlet.jsp-api', version: '2.3.1'
    runtimeOnly group: 'taglibs', name: 'string', version: '1.1.0'
    runtimeOnly group: 'commons-httpclient', name: 'commons-httpclient', version: '3.0'
    runtimeOnly group: 'commons-fileupload', name: 'commons-fileupload', version: '1.2.2'
    runtimeOnly group: 'org.json', name: 'json', version: '20170516'
    imWebApp group: "org.intermine", name: "intermine-webapp", version: imVersion, transitive: false, ext: "war"
    providedCompile group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
    tomcat "org.apache.tomcat:tomcat:9.0.115@zip"
}

processResources {
    exclude "default-template-queries.xml"
    exclude "main/"
}

tasks.register('copyModelProperties') {
    dependsOn tasks.named('processResources'), project(':dbmodel').tasks.named('processResources')
}

war {
    dependsOn 'mergeProperties', 'summariseTestObjectStore', 'unwarIMWebApp'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(explodedWebAppDir) {
        exclude "WEB-INF/lib/**"
    }
    // File dependencies have no Maven metadata; retain the core's vendored JSON library.
    from("${explodedWebAppDir}/WEB-INF/lib") {
        include "stringtree-json-2.0.5.jar"
        into "WEB-INF/lib"
    }
    exclude "WEB-INF/web.properties"
    webInf { from "${mergePropsDir}" }
}

task mergeProperties(type: Copy) {
    description "Appends intermine.properties to web.properties file"
    dependsOn 'copyModelProperties'
    def modelProperties = new File(project(':dbmodel').sourceSets.main.output.resourcesDir,
            'intermine.properties')
    inputs.file(modelProperties)
    from "${webAppDirName}/WEB-INF/web.properties"
    into "${mergePropsDir}"
    doLast {
        (new File("$mergePropsDir/web.properties")).append(modelProperties.getText())
    }
}

// this task requires a database to exist and be populated. However this task is run at compile time, not runtime.
// We have no guarantee there will be a database. Hence the try/catch
task summariseTestObjectStore {
    description "Summarise Test model ObjectStore into objectstoresummary.properties file"
    dependsOn 'copyDefaultProperties'
    dependsOn configurations.runtimeClasspath
    outputs.file("$mergePropsDir/objectstoresummary.properties")
    outputs.upToDateWhen { false }

    doLast {
        try {
            ant.taskdef(name: "summarizeObjectStoreTask", classname: "org.intermine.task.SummariseObjectStoreTask") {
                classpath {
                    dirset(dir: "$buildDir")
                    pathelement(path: configurations.runtimeClasspath.asPath)
                }
            }
            ant.summarizeObjectStoreTask(alias: "os.unittest", configFileName: "objectstoresummary.config.properties", outputFile: "build/props/objectstoresummary.properties")
        } catch (Exception e) {
            println "ERROR" + e
        }
    }
}


task unwarIMWebApp(type: Sync) {
    description "Unwar intermine-webapp under the build/explodedWebAppDir directory"
    from { zipTree(configurations.imWebApp.singleFile) }
    destinationDir = new File("$explodedWebAppDir")
}

tasks.register('warTestModelWebApp') {
    description "Create the merged testmodel webapp WAR"
    dependsOn tasks.named('war')
}

cargo {
    // change this to match your Tomcat major version (keep the x)
    containerId = 'tomcat9x'

    def props = new Properties()
    file(minePropertyFile).withInputStream { props.load(it) }

    // change this to the Tomcat root of your choice
    deployable {
        context = props.getProperty("webapp.path")
    }

    local {
        installer {
            installConfiguration = configurations.tomcat
            downloadDir= file("$buildDir/downloads")
            extractDir = file("$buildDir/extracts")
        }
        jvmArgs = '-Dorg.apache.el.parser.SKIP_IDENTIFIER_CHECK=true'
    }
}

cargoRunLocal.dependsOn war
