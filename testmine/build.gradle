ext {
    imVersion = "5.1.1"
    taskGroup = "InterMine"
    minePropertyFileName = "testmodel.properties"
    minePropertyFile = "${System.env.HOME}/.intermine/$minePropertyFileName"
    println "Using properties file: '$minePropertyFile' "
}

subprojects {
    apply plugin: 'java-library'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8
    apply from: "${rootDir}/../config/gradle/java-compatibility.gradle"
    apply from: "${rootDir}/../config/gradle/runtime-dependencies.gradle"

    repositories {
        if (project.findProperty("intermine.development.intermineRootDir")) {
            exclusiveContent {
                forRepository {
                    mavenLocal()
                }
                filter {
                    includeGroup "org.intermine"
                }
            }
        }
        maven {
            url project.getProperty("intermine.maven.central")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
        }
        maven {
            url project.getProperty("intermine.maven.ebi")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.ebi.allowInsecureProtocol") == "true"
        }
        maven {
            url project.getProperty("intermine.maven.clojars")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.clojars.allowInsecureProtocol") == "true"
        }
    }

    configurations {
        commonResources
    }

    dependencies {
        api group: 'org.apache.ant', name: 'ant', version: '1.7.0'
        api group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.22'
        api group: 'org.slf4j', name: 'slf4j-reload4j', version: '1.7.36'
        commonResources group: "org.intermine", name: "intermine-resources", version: imVersion
    }

    processResources {
        from(minePropertyFile) {
            rename 'testmodel.properties', 'intermine.properties'
        }
        from({ zipTree(configurations.commonResources.singleFile) }) {
            include 'default.intermine.test.properties'
            rename 'default.intermine.test.properties', 'default.intermine.properties'
        }
    }

    tasks.register('copyMineProperties') {
        dependsOn tasks.named('processResources')
    }

    tasks.register('copyDefaultProperties') {
        dependsOn tasks.named('processResources')
    }
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '8.14.7'
}
