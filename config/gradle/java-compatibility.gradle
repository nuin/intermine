if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
    throw new GradleException('InterMine 6 requires JDK 21 or newer. Set JAVA_HOME to a JDK 21 installation.')
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
}

ext.intermineTestSystemProperties = System.properties.findAll { key, value ->
    !['java.', 'sun.', 'jdk.'].any { prefix -> key.toString().startsWith(prefix) }
}
