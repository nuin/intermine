import org.gradle.api.plugins.quality.Checkstyle

configurations {
    checkstyleCli {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    checkstyleCli 'commons-logging:commons-logging:1.3.5'
}

tasks.named('checkstyleMain', Checkstyle) {
    // Gradle excludes Commons Logging from the engine configuration because its worker provides it.
    checkstyleClasspath = checkstyleClasspath + configurations.checkstyleCli
    // Checkstyle 7 needs analyzed classes in its process classpath to validate exception Javadoc.
    actions.clear()
    doLast { checkstyleTask ->
        def xmlReport = reports.xml.required.get()
                ? reports.xml.outputLocation.get().asFile : new File(temporaryDir, 'checkstyle.xml')
        def propertiesFile = new File(temporaryDir, 'checkstyle.properties')
        def properties = new Properties()
        configProperties.each { key, value -> properties.setProperty(key, value.toString()) }
        properties.setProperty('config_loc', configDirectory.get().asFile.absolutePath)
        propertiesFile.withOutputStream { properties.store(it, null) }
        xmlReport.parentFile.mkdirs()
        project.delete(xmlReport)

        def result = project.javaexec {
            executable = checkstyleTask.javaLauncher.get().executablePath.asFile.absolutePath
            minHeapSize = checkstyleTask.minHeapSize.orNull
            maxHeapSize = checkstyleTask.maxHeapSize.orNull
            classpath = checkstyleTask.checkstyleClasspath + checkstyleTask.classpath
            mainClass = 'com.puppycrawl.tools.checkstyle.Main'
            args '-c', checkstyleTask.configFile, '-p', propertiesFile, '-f', 'xml', '-o', xmlReport
            args checkstyleTask.source.files.sort()
            ignoreExitValue = true
        }

        if (!xmlReport.isFile()) {
            throw new GradleException("Checkstyle failed to produce a report (exit ${result.exitValue})")
        }
        def report = new XmlSlurper().parse(xmlReport)
        def violations = report.file.error
        int errorCount = violations.count { it.@severity == 'error' }
        int warningCount = violations.count { it.@severity == 'warning' }
        if (showViolations) {
            report.file.each { sourceFile ->
                sourceFile.error.each { violation ->
                    logger.lifecycle("[checkstyle] ${sourceFile.@name}:${violation.@line}: ${violation.@message}")
                }
            }
        }

        if (reports.html.required.get()) {
            def reportStylesheet = reports.html.stylesheet
            def stylesheetText = reportStylesheet == null
                    ? Checkstyle.classLoader.getResource('checkstyle-noframes-sorted.xsl').getText('UTF-8')
                    : reportStylesheet.asString()
            ant.xslt(in: xmlReport, out: reports.html.outputLocation.get().asFile) {
                param(name: 'gradleVersion', expression: gradle.gradleVersion)
                style {
                    string(value: stylesheetText)
                }
            }
        }

        if (result.exitValue != 0 && errorCount == 0) {
            throw new GradleException("Checkstyle failed with exit ${result.exitValue}")
        }
        if (errorCount > maxErrors || warningCount > maxWarnings) {
            def message = "Checkstyle violations in ${project.path}: ${errorCount} errors, ${warningCount} warnings"
            if (!ignoreFailures) {
                throw new GradleException(message)
            }
            logger.warn(message)
        }
    }
}
