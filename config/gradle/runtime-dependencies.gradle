ext.runtimeVersions = [
    postgresql: '42.7.14',
    beanutils: '1.11.0',
    collections: '3.2.2',
    io: '2.22.0',
    fileupload: '1.6.0',
    json: '20260814',
    tomcat: '9.0.124',
    jacksonBom: '2.21.8',
    lucene: '10.6.0',
    ant: '1.10.18',
    guava: '33.7.2-jre',
    compress: '1.28.0',
    lang3: '3.22.0',
    xalan: '2.7.3',
    snappy: '1.1.10.12'
]

dependencies {
    api platform("com.fasterxml.jackson:jackson-bom:${runtimeVersions.jacksonBom}")
    constraints {
        api "org.postgresql:postgresql:${runtimeVersions.postgresql}"
        api "commons-beanutils:commons-beanutils:${runtimeVersions.beanutils}"
        api "commons-collections:commons-collections:${runtimeVersions.collections}"
        api "commons-io:commons-io:${runtimeVersions.io}"
        api "commons-fileupload:commons-fileupload:${runtimeVersions.fileupload}"
        api "org.json:json:${runtimeVersions.json}"
        api "org.apache.ant:ant:${runtimeVersions.ant}"
        api "org.apache.ant:ant-launcher:${runtimeVersions.ant}"
        api "com.google.guava:guava:${runtimeVersions.guava}"
        api "org.apache.commons:commons-compress:${runtimeVersions.compress}"
        api "org.apache.commons:commons-lang3:${runtimeVersions.lang3}"
        api "xalan:xalan:${runtimeVersions.xalan}"
        api "xalan:serializer:${runtimeVersions.xalan}"
        api "org.xerial.snappy:snappy-java:${runtimeVersions.snappy}"
    }
}

pluginManager.withPlugin('war') {
    configurations.configureEach {
        exclude group: 'javax.activation', module: 'activation'
        exclude group: 'javax.activation', module: 'javax.activation-api'
        exclude group: 'jakarta.activation', module: 'jakarta.activation-api'
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: 'org.slf4j', module: 'jcl-over-slf4j'
    }
    dependencies {
        api 'com.sun.activation:jakarta.activation:1.2.2'
        api 'org.glassfish.hk2.external:javax.inject:2.5.0-b30'
        api 'commons-logging:commons-logging:1.3.5'
    }
}
