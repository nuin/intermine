apply plugin: 'war'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    providedCompile project(':intermine-api')

    api group: 'org.directwebremoting', name: 'dwr', version: '2.0.1'
    api group: 'org.apache.lucene', name: 'lucene-core', version: runtimeVersions.lucene
    api group: 'org.apache.solr', name: 'solr-solrj', version: '8.11.4'
    api group: 'javax.mail', name: 'mail', version: '1.4'
    api group: 'org.apache.struts', name: 'struts-core', version: '1.3.10'
    api group: 'org.apache.struts', name: 'struts-taglib', version: '1.3.10'
    api group: 'org.apache.struts', name: 'struts-extras', version: '1.3.10'
    api group: 'org.apache.struts', name: 'struts-tiles', version: '1.3.10'
    api group: "javax.servlet", name: "jstl", version: "1.2"
    api group: 'org.apache.taglibs', name: 'taglibs-standard', version: '1.2.5'
    api group: 'commons-fileupload', name: 'commons-fileupload', version: runtimeVersions.fileupload
    api group: 'commons-httpclient', name: 'commons-httpclient', version: '3.0'
    api group: 'org.apache.commons', name: 'commons-math3', version: '3.0'
    api group: 'org.everit.json', name: 'org.everit.json.schema', version: '1.5.1'
    api('org.apache.oltu.oauth2:org.apache.oltu.oauth2.client:1.0.1') {
        exclude group: 'org.apache.oltu.oauth2', module: 'org.apache.oltu.oauth2.common'
    }
    api 'com.fasterxml.jackson.core:jackson-databind'
    api group: 'org.glassfish.jersey.media', name: 'jersey-media-json-jackson', version: '2.25'
    api group: 'javax.ws.rs', name: 'javax.ws.rs-api', version: '2.0.1'
    api group: 'org.glassfish.jersey.core', name: 'jersey-client', version: '2.25'
    api group: 'org.apache.jena', name: 'jena-core', version: '3.16.0'
    providedCompile group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'

    api files('libs/stringtree-json-2.0.5.jar')
    providedCompile group: 'javax.servlet.jsp', name: 'javax.servlet.jsp-api', version: '2.3.1'
    providedCompile group: 'org.expressme', name: 'JOpenId', version: '1.08'
    api group: 'org.apache.commons', name: 'commons-math3', version: '3.2'
    providedCompile group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.50'

    runtimeOnly group: 'commons-io', name: 'commons-io', version: runtimeVersions.io
    runtimeOnly group: 'commons-collections', name: 'commons-collections', version: runtimeVersions.collections
    runtimeOnly group: 'commons-lang', name: 'commons-lang', version: '2.6'
    runtimeOnly group: 'commons-codec', name: 'commons-codec', version: '1.15'
    runtimeOnly 'taglibs:string:1.1.0'
    runtimeOnly group: 'fastutil', name: 'fastutil', version: '5.0.9'
    runtimeOnly group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    runtimeOnly('org.glassfish.jaxb:jaxb-runtime:2.3.9') {
        exclude group: 'jakarta.xml.bind', module: 'jakarta.xml.bind-api'
    }
    runtimeOnly group: 'org.json', name: 'json', version: runtimeVersions.json

    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(':intermine-api').sourceSets.test.output
    testImplementation group: 'org.easymock', name: 'easymock', version: '5.7.0'
    testImplementation group: 'xmlunit', name: 'xmlunit', version: '1.0'
    testImplementation group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
}

task classesJar(type: Jar) {
    archiveClassifier = 'classes'
    from sourceSets.main.output
}


artifacts {
    archives classesJar
}

publishing.publications.mavenJava.artifact(tasks.named('classesJar'))
