tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    api project(':intermine-objectstore')
    api group: 'stax', name: 'stax', version: '1.2.0' //stax-ri 1.0 not available on maven
    testImplementation group: 'xmlunit', name: 'xmlunit', version: '1.6'
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation project(':intermine-resources')
}

task testClassesJar(type: Jar) {
    archiveClassifier = 'testClasses'
    from sourceSets.test.output
}

artifacts {
    archives testClassesJar
}

publishing.publications.mavenJava.artifact(tasks.named('testClassesJar'))
