sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

tasks.test.dependsOn(':intermine-testresources:buildDB')

configurations {
    provided
    api.extendsFrom provided
}

dependencies {
    api project(':intermine-pathquery')
    api project(':intermine-integrate')
    api group: 'xalan', name: 'xalan', version: runtimeVersions.xalan
    api group: 'xalan', name: 'serializer', version: runtimeVersions.xalan
    api group: 'org.apache.solr', name: 'solr-solrj', version: runtimeVersions.solr
    api group: 'org.apache.lucene', name: 'lucene-core', version: runtimeVersions.lucene
    api group: 'org.apache.lucene', name: 'lucene-analysis-common', version: runtimeVersions.lucene
    api group: 'org.apache.lucene', name: 'lucene-queryparser', version: runtimeVersions.lucene
    api group: 'org.apache.lucene', name: 'lucene-highlighter', version: runtimeVersions.lucene
    api group: 'org.apache.lucene', name: 'lucene-queries', version: runtimeVersions.lucene
    api group: 'org.json', name: 'json', version: runtimeVersions.json
    api group: "org.apache.jena", name: "apache-jena-libs", version: "3.16.0"
    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation group: 'xmlunit', name: 'xmlunit', version: '1.0'
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(':intermine-resources')
}

jar {
    dependsOn configurations.runtimeClasspath
    // put all the JARs included in `provided` config and include them in the JAR
    from {
        (configurations.provided).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}
