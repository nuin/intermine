buildscript {
    repositories {
        ivy {
            // define in ~/.gradle/gradle.properties
            // intermine.plugin.repo=file:///your/intermine/repo/plugin/build/libs
            url project.getProperty("intermine.plugin.repo")
            patternLayout {
                artifact  "[artifact]-[revision].[ext]"
            }
            metadataSources {
                artifact()
            }
        }
        maven {
            url project.getProperty("intermine.maven.central")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
        }
    }
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

ext {
    // set here to make available to individual bio-sources
    bioVersion = System.getProperty("bioVersion")
    imVersion = System.getProperty("imVersion")
}

subprojects {
    group = 'org.intermine'
    version '6.0.0-SNAPSHOT'

    apply plugin: 'java-library'
    apply plugin: 'dbmodel'
    apply plugin: 'biosource-dbmodel'
    apply plugin: "checkstyle"

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    apply from: "${rootDir}/../../config/gradle/java-compatibility.gradle"
    apply from: "${rootDir}/../../config/gradle/runtime-dependencies.gradle"

    // -------------------------
    // Build localDirs list
    // -------------------------

    def intermineLocalDirs = []
    def intermineRootDir = project.getProperty("intermine.development.intermineRootDir")
    def intermineModules = project.getProperty("intermine.development.intermineModules")

    if (intermineRootDir && intermineModules) {
        def modules = intermineModules.split(',').collect { it.trim() }.findAll { it }
        intermineLocalDirs = modules.collect {
            module -> "${intermineRootDir}/${module}/build/libs"
        }
    }

    def bioLocalDirs = []
    def bioRootDir = project.getProperty("intermine.development.bioRootDir")
    def bioModules = project.getProperty("intermine.development.bioModules")

    if (bioRootDir && bioModules) {
        def modules = bioModules.split(',').collect { it.trim() }.findAll { it }
        bioLocalDirs = modules.collect {
            module -> "${bioRootDir}/${module}/build/libs"
        }
    }

    def localDirs = intermineLocalDirs + bioLocalDirs

    repositories {
        // Prefer locally-built InterMine artifacts
        localDirs.each { dir ->
            ivy {
                url "file://" + dir
                patternLayout {
                    artifact  "[artifact]-[revision](-[classifier]).[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }

        maven {
            url project.getProperty("intermine.maven.central")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
        }
        maven {
            url project.getProperty("intermine.maven.ebi")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.ebi.allowInsecureProtocol") == "true"
        }
    }

    configurations {
        bioModel
        mergeModel

        all {
            exclude group: 'org.apache.logging.log4j'
        }
    }

    dependencies {
        api group: 'mockobjects', name: 'mockobjects-core', version: '0.09'
        api group: 'mockobjects', name: 'mockobjects-jdk1.3', version: '0.09'
        api group: 'com.zaxxer', name: 'HikariCP', version: '3.2.0', transitive: false
        api group: 'org.apache.ant', name: 'ant', version: runtimeVersions.ant
        api group: 'org.intermine', name: 'bio-core', version: System.getProperty("bioVersion"), transitive: false
        api group : "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion") // log4j
        api group : "org.intermine", name: "intermine-resources", version: System.getProperty("imVersion") // log4j
        api group : "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
        api group: 'commons-collections', name: 'commons-collections', version: runtimeVersions.collections
        api group: 'commons-io', name: 'commons-io', version: runtimeVersions.io
        api group: 'commons-lang', name: 'commons-lang', version: '2.6'
        api group: 'commons-logging', name: 'commons-logging', version: '1.3.5'
        api group: 'org.postgresql', name: 'postgresql', version: runtimeVersions.postgresql
        api group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.22'
        api group: 'org.slf4j', name: 'slf4j-reload4j', version: runtimeVersions.slf4j
        testImplementation group: 'junit', name: 'junit', version: '4.8.2'
        testImplementation group: "org.intermine", name: "intermine-integrate", version: System.getProperty("imVersion"), classifier: "testClasses"
        testImplementation group: 'xmlunit', name: 'xmlunit', version: '1.0'
        testImplementation group: 'au.com.bytecode', name: 'opencsv', version: '2.4' //version 2.3 not available in maven
        testImplementation group: 'org.javassist', name: 'javassist', version: '3.33.0-GA'
        mergeModel group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.22'
        mergeModel group: 'org.slf4j', name: 'slf4j-reload4j', version: runtimeVersions.slf4j
        mergeModel group : "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion")
        mergeModel group : "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
        mergeModel group: 'commons-lang', name: 'commons-lang', version: '2.6'

	    // JAX-B dependencies for JDK 9+
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:2.3.2"
    implementation "org.glassfish.jaxb:jaxb-runtime:2.3.2"
    implementation "javax.annotation:javax.annotation-api:1.3.2"

    }

    dbModelConfig {
        objectStoreName = "os.bio-test"
        modelName = "genomic"
        defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
    }

    task copyMineProperties() {
        dependsOn 'processResources'
	    doLast {
            copy {
                from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
                into sourceSets.main.output.resourcesDir
                rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
            }
        }
    }

    jar {
        exclude "intermine.properties"
    }

    // see http://blog.joda.org/2014/02/turning-off-doclint-in-jdk-8-javadoc.html
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')

        // https://github.com/gradle/gradle/issues/2354
        // The '-quiet' as second argument is actually a hack,
        // since the one paramater addStringOption doesn't seem to
        // work, we extra add '-quiet', which is added anyway by
        // gradle. See https://github.com/gradle/gradle/issues/2354
        // See JDK-8200363 (https://bugs.openjdk.java.net/browse/JDK-8200363)
        // for information about the -Xwerror option.
        options.addStringOption('Xwerror', '-quiet')
    }

    if (it.name != 'bio-source-malaria-gff') {
        checkstyle {
            toolVersion = '7.8.1'
            configFile file("${rootDir}/../../config/checkstyle/checkstyle.xml")
            sourceSets = [sourceSets.main]
            showViolations = true
            ignoreFailures = false
            maxWarnings = 0
            //reportsDir = file("$project.rootDir/reports/checkstyle/$project.name")
            configProperties = [
                'checkstyle.header.file': "${rootDir}/../../config/checkstyle/copyright_header.txt",
                'suppressionFile': "${rootDir}/../../config/checkstyle/suppressions.xml"
            ]
        }
    }

    if (it.name == 'bio-source-malaria-gff') {
        checkstyle {
            toolVersion = '7.8.1'
            configFile file("${rootDir}/../../config/checkstyle/checkstyle.xml")
            sourceSets = [sourceSets.main]
            showViolations = true
            ignoreFailures = false
            maxWarnings = 0
            //reportsDir = file("$project.rootDir/reports/checkstyle/$project.name")
            configProperties = [
                'checkstyle.header.file': "${rootDir}/../../config/checkstyle/copyright_header.txt",
                'suppressionFile': "${rootDir}/../../config/checkstyle/suppressions.xml"
            ]
        }
    }


    checkstyleMain {
        source = fileTree('src/main') {
            includes = ['**/*.java']
            excludes = ['build/**']
        }
    }

    checkstyleTest {
        enabled = false
    }

    apply from: "${rootDir}/../../config/gradle/checkstyle.gradle"

    tasks.withType(Test) {
        scanForTestClasses = false
        include '**/*Test.class'
    }

    test {
        systemProperties intermineTestSystemProperties
        ignoreFailures = false
        forkEvery = 1
    }

    ext.pomDescription = 'InterMine bio sources modules'
    apply from: "${rootDir}/../../config/gradle/publishing.gradle"

    tasks.compileTestJava.dependsOn 'copyMineProperties'
}

task testReport(type: TestReport) {
    destinationDirectory = layout.buildDirectory.dir("reports/allTests")
    // Include the results from the `test` task in all subprojects
    testResults.from(subprojects.collect { it.tasks.named("test").flatMap { task -> task.binaryResultsDirectory } })
}
