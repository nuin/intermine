apply plugin: 'war'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

def explodedWebAppDir = "$buildDir/explodedWebApp"

configurations {
    imWebApp
}

dependencies {
    providedCompile project(':bio-core')
    providedCompile project(':bio-model')
    providedCompile group: "org.intermine", name: "intermine-webapp", version: System.getProperty("imVersion"), classifier: "classes"
    providedCompile group: 'org.apache.struts', name: 'struts-tiles', version: '1.3.10'
    providedCompile group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'

    api (project(':bio-tools')) { transitive = false }
    api group: "org.intermine", name: "intermine-jbrowse-endpoint", version: System.getProperty("imVersion")
    api group: 'commons-io', name: 'commons-io', version: runtimeVersions.io
    api group: 'psidev.psi.mi.jami.bridges', name: 'bridges-core', version: '3.2.12'
    api group: 'psidev.psi.mi.jami.bridges', name: 'jami-ols', version: '3.2.12'
    api group: 'psidev.psi.mi.jami', name: 'jami-core', version: '3.2.12'
    api group: 'psidev.psi.mi.jami', name: 'jami-interactionviewer-json', version: '3.2.12'
    api group: "org.biojava", name: "biojava-core", version: "4.2.0"
    api group: "org.biojava", name: "biojava-genome", version: "4.2.0"
    api group: "org.biojava", name: "biojava-ontology", version: "4.2.0"
    api group: 'org.json', name: 'json', version: runtimeVersions.json

    runtimeOnly group: 'org.apache.lucene', name: 'lucene-snowball', version: '3.0.2'

    imWebApp group: "org.intermine", name: "intermine-webapp", version: System.getProperty("imVersion"), transitive: false, ext: "war"
}

task unwarIMWebApp(type: Copy) {
    description "Unwar intermine-webapp under the build/explodedWebAppDir directory"
    from { zipTree(configurations.imWebApp.singleFile) }
    destinationDir = new File("$explodedWebAppDir")
}

war {
    dependsOn 'unwarIMWebApp'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from "${explodedWebAppDir}"
}

tasks.register('warBioWebApp') {
    description "Create the merged biological webapp WAR"
    dependsOn tasks.named('war')
}

task classesJar(type: Jar) {
    archiveClassifier = 'classes'
    from sourceSets.main.output
}

artifacts {
    archives classesJar
}

publishing.publications.mavenJava.artifact(tasks.named('classesJar'))
