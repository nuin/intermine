sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

repositories {
    maven {
        url project.getProperty("intermine.maven.central")
        allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
            project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
    }
}

dependencies {
    bioModel group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
    api group: "org.intermine", name: "intermine-model", version: imVersion
    api group: "org.intermine", name: "intermine-objectstore", version: imVersion
    api group: "org.intermine", name: "intermine-api", version: imVersion
    api group: "org.apache.jena", name: "apache-jena-libs", version: "3.16.0"
}

processResources {
    from('.') { include ("*.properties")}
}
