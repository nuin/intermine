buildscript {
    repositories {
        ivy {
            // define in ~/.gradle/gradle.properties
            // intermine.plugin.repo=file:///your/intermine/repo/plugin/build/libs
            url project.getProperty("intermine.plugin.repo")
            patternLayout {
                artifact  "[artifact]-[revision].[ext]"
            }
            metadataSources {
                artifact()
            }
        }
        maven {
            url project.getProperty("intermine.maven.central")
            allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
                project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
        }
    }
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

apply plugin: 'dbmodel'
apply plugin: 'biomodel-dbmodel'

sourceSets {
    main {
        java {
            srcDirs = ['build/gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

processResources {
    from('.') { include ("core.xml", "genomic_additions.xml")}
}

dependencies {
    api group: "org.intermine", name: "intermine-model", version: System.getProperty("imVersion")
    api group: "org.intermine", name: "intermine-objectstore", version: System.getProperty("imVersion")
    api fileTree(dir: 'libs', include: '*.jar')
    api 'commons-lang:commons-lang:2.6'
    api group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.22'
    api group: 'org.slf4j', name: 'slf4j-reload4j', version: runtimeVersions.slf4j
}

dbModelConfig {
    objectStoreName = "os.bio-test"
    modelName = "genomic"
    defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
}

task copyMineProperties(type: Copy) {
    from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
    into sourceSets.main.output.resourcesDir
    rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
}

tasks.named('copyGenomicModel') {
    actions.clear()
    setOnlyIf { true }
    doLast {
        copy {
            from sourceSets.main.output.resourcesDir
            include 'core.xml'
            into sourceSets.main.output.resourcesDir
            rename 'core.xml', 'genomic_model.xml'
        }
    }
}

tasks.buildDB.dependsOn ':bio-testresources:createUnitTestDatabases'
tasks.mergeModels.dependsOn 'processResources', 'copyGenomicModel', 'copyMineProperties', 'copyDefaultInterMineProperties'
