apply plugin: 'groovy'
apply plugin: 'java-library'

group 'org.intermine'
version '6.0.0-SNAPSHOT'

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21
apply from: "${rootDir}/../config/gradle/java-compatibility.gradle"

repositories {
    maven {
        url project.getProperty("intermine.maven.central")
        allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
            project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
    }
}

dependencies {
    api gradleApi()
    api localGroovy()
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

test { testTask ->
    // Gradle ProjectBuilder injects synthetic classes into its test classloader.
    jvmArgumentProviders.add({ ->
        testTask.javaLauncher.get().metadata.languageVersion.asInt() >= 9
                ? ['--add-opens=java.base/java.lang=ALL-UNNAMED'] : []
    } as org.gradle.process.CommandLineArgumentProvider)
}

ext.pomDescription = 'InterMine Plugin'
apply from: "${rootDir}/../config/gradle/publishing.gradle"
