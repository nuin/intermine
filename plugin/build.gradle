apply plugin: 'groovy'
apply plugin: 'java-library'

group 'org.intermine'
version '5.1.1'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    maven {
        url project.getProperty("intermine.maven.central")
        allowInsecureProtocol = "http".equalsIgnoreCase(url.scheme) &&
            project.findProperty("intermine.maven.central.allowInsecureProtocol") == "true"
    }
}

dependencies {
    api gradleApi()
    api localGroovy()
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

ext.pomDescription = 'InterMine Plugin'
apply from: "${rootDir}/../config/gradle/publishing.gradle"
